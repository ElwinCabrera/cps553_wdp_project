<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="author" content="Elwin Cabrera">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Media Archive - Register</title>
</head>
<body>

    <header>
        <div id="logo_img_text">
            <img id="logo_img" src="images/ivett-m-2EJoQ2tMhpc-unsplash.jpg" alt="A collection of DVDs">
            <h2 id="logo_text">Media Vault</h2>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="media.html">My Media</a></li>
                <li><a href="login.html">Login</a></li>
                <li><a href="register.html">Register</a></li>
            </ul>
        </nav>

    </header>

    <main>
        <h1 class="page_title">Create an Account</h1>
        <img id="img1" src="images/ivett-m-2EJoQ2tMhpc-unsplash.jpg" alt="A collection of DVDs">
        

        <form action="" method="POST">
            <label for="fname">First Name:</label>
            <input type="text" id="fname" name="fname">
            <br>

            <label for="lname">Last Name:</label>
            <input type="text" id="lname" name="lname">
            <br>

            <label for="username">Username or Email:</label>
            <input type="text" id="username" name="username">
            <br>

            <label for="pwd">Password:</label>
            <input type="password" id="pwd" name="pwd">
            <br>

            <input type="submit" value="Register">

        </form>
    </main>


    <footer></footer>
    
</body>
</html>
